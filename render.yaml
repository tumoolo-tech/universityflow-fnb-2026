# Render Blueprint: the STAGING site only (docs/deploy/README.md).
#
# Render has no South African region (render.com/docs/regions, checked 2026-10-23), and student
# data stays in South Africa (CLAUDE.md, locked decisions; POPIA s72). So this is a test copy on
# synthetic data: the local stand-ins (no real SMS, AI, S3 or database), an embedded database
# that starts empty on every deploy, and a "Staging" banner on every page. Production stays on
# Vercel in cpt1 with Postgres and S3 in af-south-1, and refuses to start on Render (config.ts).
#
# No secret lives here: AUTH_SECRET is generated by Render, UF_PUBLIC_URL is typed in the
# dashboard (sync: false). render-blueprint.test.ts holds this file to that.
#
# Nothing here is connected: the owner creates the Render workspace and applies the Blueprint.

previews:
  # No pull-request copies: each would be another public site, and sync: false values are not
  # copied into them.
  generation: off

services:
  - type: web
    name: universityflow-staging
    runtime: node
    # Nearest Render region to South Africa. Synthetic data only, so its location doesn't
    # matter for POPIA; it never holds a real learner's details.
    region: frankfurt
    # Free: sleeps after 15 idle minutes, and its disk is wiped on every deploy and restart,
    # which suits a staging site whose data must be throwaway.
    plan: free
    branch: main
    # Deploy only once CI has passed on the commit, as deploy.yml does for Vercel.
    autoDeployTrigger: checksPass
    # Node comes from .nvmrc (24.11.1); pnpm from package.json's packageManager, via Corepack.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @universityflow/web build
    startCommand: pnpm --filter @universityflow/web exec next start --hostname 0.0.0.0 --port $PORT
    # Says only whether the configuration starts (apps/web/app/api/health/route.ts).
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
    envVars:
      # Staging: refuses live providers and Vercel production; the banner and noindex follow it.
      - key: UF_DEPLOYMENT
        value: staging
      # The stand-ins only: SMS to the outbox, files to the local disk, the scripted AI.
      - key: UF_PROVIDERS
        value: local
      # Researched-but-unverified catalogue records, labelled as drafts: staging has no learners.
      - key: UF_CATALOGUE_PREVIEW
        value: "1"
      # Generated by Render on creation, never written down anywhere.
      - key: AUTH_SECRET
        generateValue: true
      # The access gate's password (A5-10): every page and API route asks for it, /api/health
      # excepted. Typed in the dashboard (16+ characters), shared only with testers.
      - key: UF_STAGING_PASSWORD
        sync: false
      # The service's own https://….onrender.com address, typed in the dashboard.
      - key: UF_PUBLIC_URL
        sync: false
